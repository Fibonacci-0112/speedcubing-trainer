name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - run: dotnet test SpeedcubingTrainer.Core.Tests/SpeedcubingTrainer.Core.Tests.csproj -c Release --nologo

  app-build:
    name: App build (${{ matrix.tfm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net10.0-desktop, net10.0-browserwasm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - name: Install the workloads the project needs (android, ios, wasm-tools)
        run: |
          dotnet workload install wasm-tools
          dotnet workload restore SpeedcubingTrainer/SpeedcubingTrainer.csproj
      - run: dotnet build SpeedcubingTrainer/SpeedcubingTrainer.csproj -f ${{ matrix.tfm }} -c Release --nologo
