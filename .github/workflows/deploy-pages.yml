name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - run: dotnet workload install wasm-tools
      - name: Publish WebAssembly head
        run: >
          dotnet publish SpeedcubingTrainer/SpeedcubingTrainer.csproj
          -f net10.0-browserwasm -c Release --nologo
          -p:RunAOTCompilation=true
          -p:WasmShellWebAppBasePath=/${{ github.event.repository.name }}/
          -o publish
      - name: Prepare site
        run: |
          cp -r publish/wwwroot site
          touch site/.nojekyll
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
